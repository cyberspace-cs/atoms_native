<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
  :root { --bg:#0b1120; --cell:#1e293b; --text:#e8edf7; --dim:#94a3b8; --cyan:#22d3ee; --red:#ef4444; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; }
  h1 { font-size:24px; margin-bottom:6px; }
  .hud { display:flex; gap:10px; margin-bottom:12px; align-items:center; }
  .hud b { color:var(--cyan); font-size:17px; }
  .hud span { color:var(--dim); font-size:12px; }
  select { background:var(--cell); color:var(--text); border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:5px 8px; }
  #board { display:grid; gap:3px; background:var(--cell); padding:8px; border-radius:10px; }
  .c { width:30px; height:30px; border-radius:6px; background:#0f172a; display:flex; align-items:center;
       justify-content:center; font-size:14px; font-weight:800; cursor:pointer; user-select:none; }
  .c.open { background:#16233b; cursor:default; }
  .c.boom { background:var(--red); }
  .n1{color:#7dd3fc}.n2{color:#34d399}.n3{color:#fca5a5}.n4{color:#a78bfa}.n5{color:#f59e0b}.n6{color:#22d3ee}.n7{color:#e8edf7}.n8{color:#94a3b8}
  #tip { color:var(--dim); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
  <h1>扫雷</h1>
  <div class="hud">
    <span>💣 <b id="mines">10</b></span>
    <span>⏱ <b id="time">0</b>s</span>
    <select id="diff" onchange="reset()">
      <option value="9,9,10">初级 9×9</option>
      <option value="12,12,24">中级 12×12</option>
      <option value="16,14,40">高级 16×14</option>
    </select>
  </div>
  <div id="board"></div>
  <div id="tip">左键翻开 · 右键/长按插旗 · 首次点击必安全</div>
<script>
"use strict";
let W, H, M, grid, opened, flags, dead, win, t0, timer;
const boardEl = document.getElementById("board");

function reset() {
  const [w, h, m] = document.getElementById("diff").value.split(",").map(Number);
  W = w; H = h; M = m;
  grid = Array.from({length:H}, ()=>Array(W).fill(0)); // -1 雷，0-8 数字
  opened = Array.from({length:H}, ()=>Array(W).fill(false));
  flags = Array.from({length:H}, ()=>Array(W).fill(false));
  dead = win = false; t0 = null;
  clearInterval(timer); document.getElementById("time").textContent = 0;
  document.getElementById("mines").textContent = M;
  boardEl.style.gridTemplateColumns = `repeat(${W},30px)`;
  boardEl.innerHTML = "";
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const d = document.createElement("div");
    d.className = "c"; d.dataset.r = r; d.dataset.c = c;
    d.oncontextmenu = e => { e.preventDefault(); flag(r, c); };
    d.onclick = () => openCell(r, c);
    let lp;
    d.addEventListener("touchstart", () => { lp = setTimeout(()=>flag(r,c), 400); }, {passive:true});
    d.addEventListener("touchend", () => clearTimeout(lp));
    boardEl.appendChild(d);
  }
}
function plant(sr, sc) { // 首次点击后才布雷，避开点击点
  let n = 0;
  while (n < M) {
    const r = Math.random()*H|0, c = Math.random()*W|0;
    if (grid[r][c] === -1 || (Math.abs(r-sr) <= 1 && Math.abs(c-sc) <= 1)) continue;
    grid[r][c] = -1; n++;
  }
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (grid[r][c] === -1) continue;
    grid[r][c] = around(r, c).filter(([a,b]) => grid[a][b] === -1).length;
  }
  t0 = Date.now();
  timer = setInterval(()=>document.getElementById("time").textContent = ((Date.now()-t0)/1000|0), 500);
}
function around(r, c) {
  const out = [];
  for (let a = r-1; a <= r+1; a++) for (let b = c-1; b <= c+1; b++)
    if ((a !== r || b !== c) && a >= 0 && a < H && b >= 0 && b < W) out.push([a, b]);
  return out;
}
function flag(r, c) {
  if (dead || win || opened[r][c]) return;
  flags[r][c] = !flags[r][c];
  cellEl(r, c).textContent = flags[r][c] ? "🚩" : "";
  document.getElementById("mines").textContent = M - flags.flat().filter(Boolean).length;
}
function openCell(r, c) {
  if (dead || win || opened[r][c] || flags[r][c]) return;
  if (!t0) plant(r, c);
  if (grid[r][c] === -1) { boom(r, c); return; }
  flood(r, c); paint(); checkWin();
}
function flood(r, c) {
  if (r < 0 || r >= H || c < 0 || c >= W || opened[r][c] || flags[r][c]) return;
  opened[r][c] = true;
  if (grid[r][c] === 0) around(r, c).forEach(([a, b]) => flood(a, b));
}
function boom(r, c) {
  dead = true; clearInterval(timer);
  for (let a = 0; a < H; a++) for (let b = 0; b < W; b++)
    if (grid[a][b] === -1) { const el = cellEl(a, b); el.classList.add("open"); el.textContent = "💣"; }
  cellEl(r, c).classList.add("boom");
}
function checkWin() {
  const left = grid.flat().filter(v => v !== -1).length - opened.flat().filter(Boolean).length;
  if (left === 0) { win = true; clearInterval(timer);
    document.getElementById("tip").textContent = "🎉 通关！用时 " + document.getElementById("time").textContent + "s"; }
}
function paint() {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (!opened[r][c] || grid[r][c] === -1) continue;
    const el = cellEl(r, c), v = grid[r][c];
    el.classList.add("open");
    if (v) { el.textContent = v; el.classList.add("n" + v); }
  }
}
const cellEl = (r, c) => boardEl.children[r*W + c];
reset();
</script>
</body>
</html>
