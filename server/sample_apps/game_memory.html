<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆翻牌</title>
<style>
  :root { --bg:#0b1120; --cell:#1e293b; --text:#e8edf7; --dim:#94a3b8; --cyan:#22d3ee; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; }
  h1 { font-size:24px; margin-bottom:6px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .hud { display:flex; gap:10px; margin-bottom:14px; }
  .box { background:var(--cell); border-radius:10px; padding:6px 16px; text-align:center; }
  .box b { display:block; font-size:17px; color:var(--cyan); }
  .box span { font-size:11px; color:var(--dim); }
  #board { display:grid; grid-template-columns:repeat(4,72px); gap:9px; }
  .card { width:72px; height:72px; perspective:400px; cursor:pointer; }
  .inner { position:relative; width:100%; height:100%; transition:transform .3s; transform-style:preserve-3d; }
  .card.flip .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:10px; display:flex; align-items:center; justify-content:center;
          backface-visibility:hidden; font-size:30px; }
  .front { background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid rgba(255,255,255,.12); }
  .front::after { content:"?"; color:var(--dim); font-size:22px; font-weight:800; }
  .back { background:var(--cell); border:1px solid rgba(34,211,238,.4); transform:rotateY(180deg); }
  .card.done .back { border-color:rgba(16,185,129,.7); opacity:.75; }
  .btn { margin-top:16px; background:rgba(34,211,238,.12); color:var(--cyan); border:1px solid rgba(34,211,238,.45);
         border-radius:10px; padding:8px 22px; font-size:13.5px; cursor:pointer; }
  #tip { color:var(--dim); font-size:12px; margin-top:10px; min-height:16px; }
</style>
</head>
<body>
  <h1>记忆翻牌</h1>
  <div class="sub">翻出所有相同 emoji 的配对，越少步数越强</div>
  <div class="hud">
    <div class="box"><b id="moves">0</b><span>步数</span></div>
    <div class="box"><b id="pairs">0/8</b><span>已配对</span></div>
    <div class="box"><b id="time">0</b><span>秒</span></div>
  </div>
  <div id="board"></div>
  <button class="btn" onclick="reset()">重新开始</button>
  <div id="tip"></div>
<script>
"use strict";
const EMOJI = ["🐍","🍅","🚀","💻","🎮","🎯","⚡","🌙"];
let first, lock, moves, pairs, t0, timer;
const boardEl = document.getElementById("board");

function reset() {
  boardEl.innerHTML = ""; first = null; lock = false; moves = 0; pairs = 0;
  document.getElementById("moves").textContent = 0;
  document.getElementById("pairs").textContent = "0/8";
  document.getElementById("time").textContent = 0;
  document.getElementById("tip").textContent = "";
  clearInterval(timer);
  const deck = [...EMOJI, ...EMOJI].sort(() => Math.random() - .5);
  deck.forEach(e => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = '<div class="inner"><div class="face front"></div><div class="face back">' + e + '</div></div>';
    c.dataset.e = e;
    c.onclick = () => flip(c);
    boardEl.appendChild(c);
  });
}
function flip(c) {
  if (lock || c.classList.contains("flip") || c.classList.contains("done")) return;
  if (!t0) { t0 = Date.now(); timer = setInterval(()=>document.getElementById("time").textContent = ((Date.now()-t0)/1000|0), 500); }
  c.classList.add("flip");
  if (!first) { first = c; return; }
  moves++; document.getElementById("moves").textContent = moves;
  if (first.dataset.e === c.dataset.e) {
    first.classList.add("done"); c.classList.add("done");
    first = null; pairs++;
    document.getElementById("pairs").textContent = pairs + "/8";
    if (pairs === 8) {
      clearInterval(timer);
      document.getElementById("tip").textContent = "🎉 全部配对完成！" + moves + " 步 · 用时 " + document.getElementById("time").textContent + "s";
    }
  } else {
    lock = true;
    const a = first; first = null;
    setTimeout(() => { a.classList.remove("flip"); c.classList.remove("flip"); lock = false; }, 650);
  }
}
reset();
</script>
</body>
</html>
