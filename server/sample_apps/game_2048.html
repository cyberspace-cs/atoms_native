<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · 数字滑块</title>
<style>
  :root { --bg:#0b1120; --cell:#1e293b; --text:#e8edf7; --dim:#94a3b8; --cyan:#22d3ee; }
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  h1 { font-size:26px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .hud { display:flex; gap:10px; margin-bottom:12px; }
  .box { background:var(--cell); border-radius:10px; padding:6px 16px; text-align:center; }
  .box b { display:block; font-size:18px; color:var(--cyan); }
  .box span { font-size:11px; color:var(--dim); }
  #grid { display:grid; grid-template-columns:repeat(4,74px); grid-template-rows:repeat(4,74px); gap:8px;
          background:var(--cell); padding:8px; border-radius:12px; }
  .tile { border-radius:8px; display:flex; align-items:center; justify-content:center;
          font-weight:800; font-size:24px; background:#0f172a; color:var(--text); transition:.08s; }
  .btn { margin-top:14px; background:rgba(34,211,238,.12); color:var(--cyan); border:1px solid rgba(34,211,238,.45);
         border-radius:10px; padding:8px 22px; font-size:13.5px; cursor:pointer; }
  #tip { color:var(--dim); font-size:12px; margin-top:10px; }
  @media (max-width:420px) { #grid { grid-template-columns:repeat(4,64px); grid-template-rows:repeat(4,64px); } }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="sub">方向键 / 滑动屏幕，相同数字碰撞合并，合出 2048！</div>
  <div class="hud">
    <div class="box"><b id="score">0</b><span>得分</span></div>
    <div class="box"><b id="best">0</b><span>最高分</span></div>
  </div>
  <div id="grid"></div>
  <button class="btn" onclick="reset()">重新开始</button>
  <div id="tip"></div>
<script>
"use strict";
let board, score, over, moved;
const best = () => +(localStorage.getItem("best2048") || 0);
const gridEl = document.getElementById("grid");
for (let i = 0; i < 16; i++) { const d = document.createElement("div"); d.className = "tile"; gridEl.appendChild(d); }
const tiles = [...gridEl.children];
const COLORS = { 2:"#334155",4:"#3b5578",8:"#0ea5e9",16:"#22d3ee",32:"#10b981",64:"#f59e0b",128:"#ef4444",256:"#ec4899",512:"#a78bfa",1024:"#facc15",2048:"#22d3ee" };

function reset() {
  board = Array(16).fill(0); score = 0; over = false;
  addTile(); addTile(); paint();
}
function addTile() {
  const empty = board.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if (!empty.length) return;
  board[empty[Math.random()*empty.length|0]] = Math.random() < .9 ? 2 : 4;
}
function paint() {
  board.forEach((v,i)=>{
    const t = tiles[i]; t.textContent = v || "";
    t.style.background = COLORS[v] || "#0f172a";
    t.style.fontSize = v >= 1024 ? "19px" : "24px";
    t.style.color = v >= 8 ? "#08101e" : "var(--text)";
  });
  document.getElementById("score").textContent = score;
  if (score > best()) localStorage.setItem("best2048", score);
  document.getElementById("best").textContent = Math.max(best(), score);
}
function slide(line) { // 向左压缩+合并一行
  const a = line.filter(v=>v);
  for (let i = 0; i < a.length-1; i++)
    if (a[i] === a[i+1]) { a[i]*=2; score+=a[i]; a.splice(i+1,1); }
  while (a.length < 4) a.push(0);
  return a;
}
function move(dir) { // 0左 1右 2上 3下
  if (over) return; moved = false;
  for (let r = 0; r < 4; r++) {
    const idx = [0,1,2,3].map(c => dir<2 ? r*4+c : c*4+r);
    const line = idx.map(i => board[i]);
    const ns = slide(dir%2 ? line.reverse() : line);
    if (dir%2) ns.reverse();
    idx.forEach((bi,k)=>{ if (board[bi] !== ns[k]) moved = true; board[bi] = ns[k]; });
  }
  if (moved) { addTile(); paint(); }
  if (board.includes(2048)) document.getElementById("tip").textContent = "🎉 2048 达成！继续挑战更高分";
  if (!board.includes(0) && !canMerge()) { over = true; document.getElementById("tip").textContent = "游戏结束，得分 " + score; }
}
function canMerge() {
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    if (c < 3 && board[r*4+c] === board[r*4+c+1]) return true;
    if (r < 3 && board[r*4+c] === board[(r+1)*4+c]) return true;
  }
  return false;
}
addEventListener("keydown", e => {
  const m = { ArrowLeft:0, ArrowRight:1, ArrowUp:2, ArrowDown:3, a:0, d:1, w:2, s:3 };
  if (m[e.key] !== undefined) { e.preventDefault(); move(m[e.key]); }
});
let tx, ty;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 0) : (dy > 0 ? 3 : 2));
}, {passive:true});
reset();
</script>
</body>
</html>
