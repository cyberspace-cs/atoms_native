<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<style>
  :root { --bg:#0b1120; --cell:#1e293b; --text:#e8edf7; --dim:#94a3b8; --cyan:#22d3ee; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:min(420px,100%); background:var(--cell); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:28px; }
  h1 { font-size:22px; margin-bottom:20px; }
  .out { display:flex; gap:8px; }
  #pw { flex:1; background:#0f172a; border:1px solid rgba(34,211,238,.4); border-radius:11px;
        padding:13px 14px; font-family:ui-monospace,Consolas,monospace; font-size:15.5px; color:var(--cyan);
        word-break:break-all; outline:none; user-select:all; }
  .cp { flex:none; padding:0 18px; border:none; border-radius:11px; cursor:pointer;
        background:linear-gradient(90deg,#22d3ee,#a78bfa); color:#08101e; font-weight:800; font-size:13.5px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:18px; }
  .row label { color:var(--dim); font-size:13.5px; }
  input[type=range] { width:170px; accent-color:#22d3ee; }
  .len { color:var(--cyan); font-weight:800; font-size:15px; min-width:26px; text-align:right; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .opt { display:flex; align-items:center; gap:8px; background:#0f172a; border:1px solid rgba(255,255,255,.1);
         border-radius:10px; padding:10px 12px; font-size:13.5px; cursor:pointer; }
  .opt input { accent-color:#22d3ee; }
  .meter { height:8px; background:#0f172a; border-radius:99px; margin-top:20px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; border-radius:99px; background:#ef4444; transition:.25s; }
  .mt { display:flex; justify-content:space-between; margin-top:6px; color:var(--dim); font-size:11.5px; }
  .btn { width:100%; margin-top:20px; padding:12px 0; border:none; border-radius:11px; cursor:pointer;
         background:rgba(34,211,238,.14); color:var(--cyan); font-size:14.5px; font-weight:700;
         border:1px solid rgba(34,211,238,.4); }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 密码生成器</h1>
    <div class="out">
      <div id="pw">点击下方生成</div>
      <button class="cp" onclick="copy()">复制</button>
    </div>
    <div class="row"><label>长度 <b class="len" id="lv">16</b></label>
      <input type="range" id="len" min="6" max="32" value="16" oninput="document.getElementById('lv').textContent=this.value"></div>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="up" checked>大写字母 A-Z</label>
      <label class="opt"><input type="checkbox" id="low" checked>小写字母 a-z</label>
      <label class="opt"><input type="checkbox" id="num" checked>数字 0-9</label>
      <label class="opt"><input type="checkbox" id="sym" checked>符号 !@#$</label>
    </div>
    <div class="meter"><i id="mi"></i></div>
    <div class="mt"><span>强度</span><span id="mt">--</span></div>
    <button class="btn" onclick="gen()">⚡ 生成密码</button>
  </div>
<script>
"use strict";
function gen() {
  const pools = { up:"ABCDEFGHJKLMNPQRSTUVWXYZ", low:"abcdefghijkmnpqrstuvwxyz",
                  num:"23456789", sym:"!@#$%^&*()-_=+[]{}" };
  let chars = "";
  for (const [id, p] of Object.entries(pools))
    if (document.getElementById(id).checked) chars += p;
  if (!chars) { document.getElementById("pw").textContent = "至少选一种字符"; return; }
  const n = +document.getElementById("len").value;
  const arr = new Uint32Array(n); crypto.getRandomValues(arr);
  const pw = [...arr].map(x => chars[x % chars.length]).join("");
  document.getElementById("pw").textContent = pw;
  // 强度：字符集 × 长度 的熵粗估
  const bits = Math.round(n * Math.log2(chars.length));
  const mi = document.getElementById("mi"), mt = document.getElementById("mt");
  const lv = bits < 50 ? [28, "#ef4444", "弱"] : bits < 75 ? [55, "#f59e0b", "中"]
           : bits < 100 ? [78, "#10b981", "强"] : [100, "#22d3ee", "极强"];
  mi.style.width = lv[0] + "%"; mi.style.background = lv[1];
  mt.textContent = lv[2] + " · 熵约 " + bits + " bit"; mt.style.color = lv[1];
}
function copy() {
  const t = document.getElementById("pw").textContent;
  if (!t || t === "点击下方生成") return;
  navigator.clipboard.writeText(t).then(() => { document.querySelector(".cp").textContent = "已复制"; setTimeout(()=>document.querySelector(".cp").textContent = "复制", 1200); });
}
gen();
</script>
</body>
</html>
