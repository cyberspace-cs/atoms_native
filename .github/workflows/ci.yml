name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (syntax + imports)
        run: python -m compileall -q server tests

      - name: Start server (mock mode, no API key required)
        working-directory: server
        env:
          LLM_PROVIDER: deepseek
          PORT: "8099"
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8099 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/api/models >/dev/null; then
              echo "server up after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/api/models || { echo "server failed to start"; cat /tmp/uvicorn.log; exit 1; }

      - name: Smoke test (auth, generate, security scan, metrics, feedback, rollback)
        env:
          ATOMS_BASE: http://127.0.0.1:8099
        run: python tests/smoke.py

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true

  # ---- AI CI/CD: 评估门禁（对照企业实践：eval-gate + run-twice-average 抗抖动）----
  # 无 API Key 时走 mock 模式：离线模板本身是合法 HTML，结构化输出有效性仍为 1.0，
  # 门禁可过；真实质量评估需在有 key 的环境本地运行 runner.py --runs N。
  # 门禁判定统一走 scripts/eval_gate.py，并由 tests/gate_test.py 证明其「回归会红」。
  eval-gate:
    runs-on: ubuntu-latest
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Gate self-test (负例注入：证明回归失败则红)
        run: python tests/gate_test.py
      - name: Run eval harness (mock, run-twice-average)
        working-directory: server
        run: python -m evals.runner --runs 2
        env:
          LLM_PROVIDER: deepseek
      - name: Eval gate (fail on regression)
        run: python scripts/eval_gate.py --expect-mock

  # ---- Canary 发布（需密钥；默认不触发，由 secrets.DEPLOY_CANARY=true 开启）----
  canary-deploy:
    runs-on: ubuntu-latest
    needs: [build-and-smoke, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_CANARY == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy canary (1% traffic) to atoms-native
        env:
          SSH_HOST: ${{ secrets.ATOMS_HOST }}
          SSH_USER: ${{ secrets.ATOMS_USER }}
          SSH_KEY: ${{ secrets.ATOMS_SSH_KEY }}
        run: |
          # 真实 canary 脚本：备份 → 部署 → 健康检查 → 异常自动回滚
          # 脚本本体见 deploy/canary.sh（本地/服务器均可执行并已实测）
          install -m 600 -D /dev/null ~/.ssh/id_canary
          echo "$SSH_KEY" > ~/.ssh/id_canary
          scp -O -i ~/.ssh/id_canary "$SSH_USER@$SSH_HOST:/home/ubuntu/atoms-native/deploy/canary.sh" /tmp/canary.sh
          ssh -O -i ~/.ssh/id_canary "$SSH_USER@$SSH_HOST" "bash /tmp/canary.sh"

  # ---- 模型 Artifact Registry（模型 ID = 语义名+时间戳+版本+数据集 hash）----
  model-registry:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Register model artifact metadata
        run: |
          python - <<'PY'
          import json, hashlib, datetime
          cases = json.load(open("server/evals/cases.json", encoding="utf-8"))
          ds = json.dumps(cases, ensure_ascii=False, sort_keys=True).encode()
          ds_hash = hashlib.sha256(ds).hexdigest()[:12]
          meta = {
            "model_id": "atoms-native-pipeline",
            "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ"),
            "version": "${{ github.ref_name }}",
            "dataset_hash": ds_hash,
            "n_cases": len(cases),
          }
          json.dump(meta, open("model_registry.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("registered:", meta)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-registry
          path: model_registry.json
