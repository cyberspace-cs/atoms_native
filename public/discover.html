<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发现 · Atoms Native</title>
  <script>document.documentElement.dataset.theme = (function () { try { return localStorage.getItem("an_theme") || "light" } catch (e) { return "light" } })();</script>
  <style>
    :root {
      --bg: #070b14;
      --bg2: #0b1120;
      --card: rgba(255, 255, 255, .04);
      --line: rgba(255, 255, 255, .09);
      --text: #e8edf7;
      --dim: #94a3b8;
      --cyan: #22d3ee;
      --violet: #a78bfa;
      --grad: linear-gradient(90deg, #22d3ee, #a78bfa 60%, #f472b6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: radial-gradient(1200px 600px at 80% -10%, rgba(167, 139, 250, .12), transparent), var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 44px 24px 90px
    }

    a {
      color: var(--cyan);
      text-decoration: none
    }

    /* ---- 头部：一个大标题 + 一句小字，粗细对比 ---- */
    header .kicker {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .25em;
      text-transform: uppercase
    }

    header h1 {
      font-size: 36px;
      margin: 10px 0 8px;
      font-weight: 800;
      letter-spacing: -.02em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--dim);
      font-size: 14px;
      line-height: 1.8;
      max-width: 560px
    }

    /* ---- 工具栏：搜索 + 排序 ---- */
    .toolbar {
      display: flex;
      gap: 12px;
      margin: 30px 0 24px;
      align-items: center;
      flex-wrap: wrap
    }

    .search {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      transition: .18s
    }

    .search:focus-within {
      border-color: rgba(34, 211, 238, .45)
    }

    .search svg {
      flex: none;
      opacity: .55
    }

    .search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px
    }

    .search input::placeholder {
      color: var(--dim)
    }

    .sorter {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      flex: none
    }

    .sorter button {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: var(--dim);
      font-size: 13px;
      cursor: pointer;
      transition: .18s
    }

    .sorter button.on {
      background: rgba(34, 211, 238, .1);
      color: var(--cyan)
    }

    /* ---- 分类 chips：极简单选 ---- */
    .chips {
      display: flex;
      gap: 8px;
      margin: 0 0 24px;
      flex-wrap: wrap
    }

    .chip {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      font-size: 13px;
      cursor: pointer;
      transition: .18s;
    }

    .chip:hover {
      color: var(--text);
      border-color: rgba(34, 211, 238, .4)
    }

    .chip.on {
      background: rgba(34, 211, 238, .1);
      color: var(--cyan);
      border-color: rgba(34, 211, 238, .45)
    }

    /* ---- 卡片网格 ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, border-color .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(167, 139, 250, .45)
    }

    .cover {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      position: relative
    }

    .playable {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10.5px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(7, 11, 20, .65);
      border: 1px solid rgba(16, 185, 129, .55);
      color: #34d399;
      letter-spacing: .08em
    }

    .g0 {
      background: linear-gradient(135deg, #0ea5e933, #8b5cf633)
    }

    .g1 {
      background: linear-gradient(135deg, #f59e0b33, #ef444433)
    }

    .g2 {
      background: linear-gradient(135deg, #10b98133, #0ea5e933)
    }

    .g3 {
      background: linear-gradient(135deg, #8b5cf633, #ec489933)
    }

    .body {
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .cat {
      font-size: 11px;
      color: var(--violet);
      letter-spacing: .15em
    }

    .title {
      font-size: 16.5px;
      font-weight: 700;
      margin: 5px 0 4px
    }

    .desc {
      font-size: 12.5px;
      color: var(--dim);
      line-height: 1.7;
      flex: 1
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px
    }

    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex: none;
      background: var(--grad);
      color: #070b14;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .author {
      font-size: 12px;
      color: var(--dim)
    }

    .views {
      font-size: 12px;
      color: var(--dim);
      margin-left: auto
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .demo {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
      transition: .18s
    }

    .demo:hover {
      color: var(--violet);
      border-color: rgba(167, 139, 250, .5)
    }

    .use {
      flex: 1.4;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(34, 211, 238, .4);
      background: rgba(34, 211, 238, .08);
      color: var(--cyan);
      font-size: 13px;
      font-weight: 600;
      transition: .18s;
    }

    .use:hover {
      background: rgba(34, 211, 238, .18)
    }

    .empty {
      color: var(--dim);
      margin-top: 48px;
      font-size: 14px;
      text-align: center
    }

    footer {
      margin-top: 64px;
      color: var(--dim);
      font-size: 13px;
      text-align: center
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg2);
      border: 1px solid rgba(34, 211, 238, .45);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    /* a11y（loop engineering 2026-09-04） */
    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }

    /* ---- 浅色主题（an_theme=light，全站默认） ---- */
    html[data-theme="light"] {
      color-scheme: light
    }

    html[data-theme="light"] {
      --bg: #fafaf7;
      --bg2: #f1f2ee;
      --card: #fff;
      --line: #e4e5df;
      --text: #202222;
      --dim: #626561;
      --cyan: #4659df;
      --violet: #7560cb;
      --grad: linear-gradient(90deg, #4659df, #7560cb)
    }
  </style>
  <link rel="stylesheet" href="./theme.css">
  <script src="./theme.js" defer></script>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="kicker">DISCOVER · COMMUNITY</div>
      <h1>发现</h1>
      <p>看看社区用一句话造了什么。挑一个顺眼的模板，一键变成你的项目，改一句话就是你的作品。</p>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式"
        style="position:fixed;top:18px;right:20px;z-index:60">🌙</button>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input id="q" type="text" placeholder="搜索模板、想法、关键词…" autocomplete="off">
      </label>
      <div class="sorter" id="sorter">
        <button class="on" data-sort="views">🔥 最热</button>
        <button data-sort="new">✨ 最新</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">暂无模板</div>

    <footer>Atoms Native · <a href="./index.html">返回官网</a> · <a href="./studio.html">进入工作台</a> · <a
        href="./plan.html">版本历史</a></footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    let ITEMS = [];
    let CAT = '全部';
    let SORT = 'views';
    let Q = '';
    let debounce = null;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderChips() {
      const cats = ['全部', ...new Set(ITEMS.map(i => i.category))];
      document.getElementById('chips').innerHTML = cats.map(c => {
        const n = c === '全部' ? ITEMS.length : ITEMS.filter(i => i.category === c).length;
        return `<button class="chip${c === CAT ? ' on' : ''}" data-cat="${esc(c)}">${esc(c)} <span style="opacity:.55">${n}</span></button>`;
      }).join('');
      document.querySelectorAll('.chip').forEach(b => b.onclick = () => { CAT = b.dataset.cat; renderChips(); renderGrid(); });
    }

    function renderGrid() {
      const list = ITEMS.filter(i => CAT === '全部' || i.category === CAT);
      const empty = document.getElementById('empty');
      empty.style.display = list.length ? 'none' : 'block';
      empty.textContent = Q ? `没有找到和「${Q}」相关的模板` : '暂无模板';
      document.getElementById('grid').innerHTML = list.map((it, idx) => `
    <div class="card">
      <div class="cover g${idx % 4}">${esc(it.emoji)}${it.has_sample ? '<span class="playable">可试玩</span>' : ''}</div>
      <div class="body">
        <div class="cat">${esc(it.category)}</div>
        <div class="title">${esc(it.title)}</div>
        <div class="desc">${esc(it.description)}</div>
        <div class="meta">
          <span class="avatar">${esc((it.author || 'A')[0].toUpperCase())}</span>
          <a class="author" href="./portfolio.html?u=${encodeURIComponent(it.author)}">${esc(it.author)}</a>
          <span class="views">🚀 ${it.uses || 0} · 👁 ${it.views}</span>
        </div>
        <div class="btns">
          ${it.has_sample ? `<a class="demo" href="./api/discover/${it.id}/sample" target="_blank" rel="noopener">▶ 真实示例</a>` : ''}
          <button class="use" data-id="${it.id}">使用此模板 →</button>
        </div>
      </div>
    </div>`).join('');
      document.querySelectorAll('.use').forEach(b => b.onclick = () => useTemplate(b.dataset.id));
    }

    async function useTemplate(id) {
      const token = localStorage.getItem('an_token');
      try {
        const res = await fetch(`./api/discover/${id}/use`, {
          method: 'POST',
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (res.status === 401) {
          // 未登录：把模板想法带给工作台，登录后输入框自动填充
          const it = ITEMS.find(x => String(x.id) === String(id));
          location.href = './build.html?idea=' + encodeURIComponent(it ? it.idea : '');
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        toast('已创建项目！正在前往工作台…');
        setTimeout(() => { location.href = './studio.html?project=' + data.project_id; }, 900);
      } catch (e) {
        toast('使用失败：' + e.message);
      }
    }

    async function load() {
      try {
        const p = new URLSearchParams();
        if (Q) p.set('q', Q);
        if (SORT) p.set('sort', SORT);
        const res = await fetch('./api/discover' + (p.toString() ? '?' + p : ''));
        ITEMS = (await res.json()).items || [];
        renderChips();
        renderGrid();
      } catch (e) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('empty').textContent = '加载失败：' + e.message;
      }
    }

    // 搜索：300ms 防抖，逐字即时反馈
    document.getElementById('q').addEventListener('input', e => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        Q = e.target.value.trim();
        CAT = '全部';
        load();
      }, 300);
    });
    // 排序：最热 / 最新
    document.querySelectorAll('#sorter button').forEach(b => b.onclick = () => {
      SORT = b.dataset.sort;
      document.querySelectorAll('#sorter button').forEach(x => x.classList.toggle('on', x === b));
      load();
    });
    load();
  </script>
</body>

</html>
