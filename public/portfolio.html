<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 · Atoms Native</title>
  <script>document.documentElement.dataset.theme = (function () { try { return localStorage.getItem("an_theme") || "light" } catch (e) { return "light" } })();</script>
  <style>
    :root {
      --bg: #070b14;
      --bg2: #0b1120;
      --card: rgba(255, 255, 255, .04);
      --line: rgba(255, 255, 255, .09);
      --text: #e8edf7;
      --dim: #94a3b8;
      --cyan: #22d3ee;
      --violet: #a78bfa;
      --grad: linear-gradient(90deg, #22d3ee, #a78bfa 60%, #f472b6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: radial-gradient(1200px 600px at 80% -10%, rgba(167, 139, 250, .12), transparent), var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 44px 24px 90px
    }

    a {
      color: var(--cyan);
      text-decoration: none
    }

    header .kicker {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .25em;
      text-transform: uppercase
    }

    .who {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 18px 0 8px
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      flex: none;
      background: var(--grad);
      color: #070b14;
      font-size: 28px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.02em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .stats {
      display: flex;
      gap: 22px;
      margin: 16px 0 30px
    }

    .stat .n {
      font-size: 22px;
      font-weight: 800;
      color: var(--text)
    }

    .stat .l {
      font-size: 12px;
      color: var(--dim);
      margin-top: 2px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, border-color .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(167, 139, 250, .45)
    }

    .cover {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px
    }

    .g0 {
      background: linear-gradient(135deg, #0ea5e933, #8b5cf633)
    }

    .g1 {
      background: linear-gradient(135deg, #f59e0b33, #ef444433)
    }

    .g2 {
      background: linear-gradient(135deg, #10b98133, #0ea5e933)
    }

    .g3 {
      background: linear-gradient(135deg, #8b5cf633, #ec489933)
    }

    .body {
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .cat {
      font-size: 11px;
      color: var(--violet);
      letter-spacing: .15em
    }

    .title {
      font-size: 16.5px;
      font-weight: 700;
      margin: 5px 0 4px
    }

    .desc {
      font-size: 12.5px;
      color: var(--dim);
      line-height: 1.7;
      flex: 1
    }

    .meta {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--dim)
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .demo {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
      transition: .18s
    }

    .demo:hover {
      color: var(--violet);
      border-color: rgba(167, 139, 250, .5)
    }

    .use {
      flex: 1.4;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(34, 211, 238, .4);
      background: rgba(34, 211, 238, .08);
      color: var(--cyan);
      font-size: 13px;
      font-weight: 600;
      transition: .18s
    }

    .use:hover {
      background: rgba(34, 211, 238, .18)
    }

    .empty {
      color: var(--dim);
      margin-top: 48px;
      font-size: 14px;
      text-align: center
    }

    footer {
      margin-top: 64px;
      color: var(--dim);
      font-size: 13px;
      text-align: center
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg2);
      border: 1px solid rgba(34, 211, 238, .45);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    /* a11y（loop engineering 2026-09-04） */
    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }

    /* ---- 浅色主题（an_theme=light，全站默认） ---- */
    html[data-theme="light"] {
      color-scheme: light
    }

    html[data-theme="light"] {
      --bg: #fafaf7;
      --bg2: #f1f2ee;
      --card: #fff;
      --line: #e4e5df;
      --text: #202222;
      --dim: #626561;
      --cyan: #4659df;
      --violet: #7560cb;
      --grad: linear-gradient(90deg, #4659df, #7560cb)
    }
  </style>
  <link rel="stylesheet" href="./theme.css">
  <script src="./theme.js" defer></script>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="kicker">PORTFOLIO · CREATOR</div>
      <div class="who">
        <div class="avatar" id="avatar">?</div>
        <div>
          <h1 id="name">…</h1>
          <div class="kicker" id="sub">的创作合集</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="n" id="nWorks">0</div>
          <div class="l">作品</div>
        </div>
        <div class="stat">
          <div class="n" id="nViews">0</div>
          <div class="l">总浏览</div>
        </div>
        <div class="stat">
          <div class="n" id="nUses">0</div>
          <div class="l">被 Remix</div>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式"
        style="position:fixed;top:18px;right:20px;z-index:60">🌙</button>
    </header>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">这位创作者还没有发布作品</div>

    <footer>Atoms Native · <a href="./index.html">返回官网</a> · <a href="./discover.html">去发现</a> · <a
        href="./studio.html">进入工作台</a></footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const USER = params.get('u') || '';
    let ITEMS = [];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderHead() {
      document.title = (USER || '创作者') + ' 的作品集 · Atoms Native';
      document.getElementById('name').textContent = USER || '匿名创作者';
      document.getElementById('avatar').textContent = (USER || 'A')[0].toUpperCase();
      document.getElementById('nWorks').textContent = ITEMS.length;
      document.getElementById('nViews').textContent = ITEMS.reduce((s, i) => s + (i.views || 0), 0);
      document.getElementById('nUses').textContent = ITEMS.reduce((s, i) => s + (i.uses || 0), 0);
    }

    function renderGrid() {
      document.getElementById('empty').style.display = ITEMS.length ? 'none' : 'block';
      document.getElementById('grid').innerHTML = ITEMS.map((it, idx) => `
    <div class="card">
      <div class="cover g${idx % 4}">${esc(it.emoji)}</div>
      <div class="body">
        <div class="cat">${esc(it.category)}</div>
        <div class="title">${esc(it.title)}</div>
        <div class="desc">${esc(it.description)}</div>
        <div class="meta"><span>🚀 ${it.uses || 0}</span><span>👁 ${it.views}</span></div>
        <div class="btns">
          ${it.has_sample ? `<a class="demo" href="./api/discover/${it.id}/sample" target="_blank" rel="noopener">▶ 真实示例</a>` : ''}
          <button class="use" data-id="${it.id}">使用此模板 →</button>
        </div>
      </div>
    </div>`).join('');
      document.querySelectorAll('.use').forEach(b => b.onclick = () => useTemplate(b.dataset.id));
    }

    async function useTemplate(id) {
      const token = localStorage.getItem('an_token');
      try {
        const res = await fetch(`./api/discover/${id}/use`, {
          method: 'POST',
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (res.status === 401) {
          const it = ITEMS.find(x => String(x.id) === String(id));
          location.href = './build.html?idea=' + encodeURIComponent(it ? it.idea : '');
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        toast('已创建项目！正在前往工作台…');
        setTimeout(() => { location.href = './studio.html?project=' + data.project_id; }, 900);
      } catch (e) {
        toast('使用失败：' + e.message);
      }
    }

    async function load() {
      if (!USER) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('empty').textContent = '缺少作者参数：portfolio.html?u=用户名';
        return;
      }
      try {
        const res = await fetch('./api/discover?author=' + encodeURIComponent(USER));
        ITEMS = (await res.json()).items || [];
        renderHead();
        renderGrid();
      } catch (e) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('empty').textContent = '加载失败：' + e.message;
      }
    }
    load();
  </script>
</body>

</html>
